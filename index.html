.eng-core{position:relative;width:340px;height:230px;display:flex;align-items:center;justify-content:center;perspective:800px}
.arc-svg{position:absolute;top:-16px;left:0;width:340px;height:210px;overflow:visible;animation:arcFloat 3.4s ease-in-out infinite}

.orb1{position:absolute;top:64px;width:156px;height:156px;border:1px dashed rgba(56,189,248,.45);border-radius:50%;animation:spinCw 10s linear infinite}

.sp-sub{font-size:11.5px;letter-spacing:4px;color:#38bdf8;margin-top:6px;font-weight:600;animation:slideUp .7s ease .55s both}

.sp-bar{height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#38bdf8,#818cf8);animation:loadBar 3.3s ease forwards}

@keyframes scanDown{0%,100%{top:8%;opacity:.2}50%{top:92%;opacity:.95}}
@keyframes arcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tilt3D{0%,100%{transform:rotateY(16deg) rotateX(6deg)}50%{transform:rotateY(-16deg) rotateX(-6deg)}}
@keyframes spinCw{to{transform:rotate(360deg)}}@keyframes spinRev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes loadBar{to{width:100%}}@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes curtainOut{to{transform:scale(1.06);opacity:0;visibility:hidden;pointer-events:none}}
@keyframes dashIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

function calc(saveLog){
  var p=document.getElementById('pn').value,dt=document.getElementById('dt').value,t=parseFloat(document.getElementById('tv').value)||0,tol=Math.abs(parseFloat(document.getElementById('tl').value)||0),a=parseFloat(document.getElementById('av').value)||0,pt=document.getElementById('pt').value,diff=(a-t).toFixed(3);
  var pass=(dt==='dim'||dt==='hardness')&&(Math.abs(diff)<=tol),out=document.getElementById('out'),lg=document.getElementById('lg');
  var imgTag=partImg?"<div><span style='font-size:12px;color:var(--sub)'>Damaged Part Photo Evidence:</span><img src='"+partImg+"' class='part-img'></div><br>":"";
  var thumb=partImg?"<img src='"+partImg+"' style='width:38px;height:38px;object-fit:cover;border-radius:6px'>":"—";
  if(saveLog){document.getElementById('bc').innerText=parseInt(document.getElementById('bc').innerText)+1;sh+=2.4;document.getElementById('ts').innerText=sh.toFixed(1)+" Hrs";}
  if(pass){var u=(dt==='hardness')?" HRC":" mm";out.innerHTML="<div class='pass'>✅ PASS — Within Spec (±"+tol+u+", Dev: "+diff+u+")</div>"+imgTag+"<small style='color:var(--sub)'>"+bName+" • CO-POWERED BY VISHWASH</small>";if(saveLog)lg.innerHTML="<tr><td>"+p+"</td><td>"+dt.toUpperCase()+"</td><td>"+thumb+"</td><td style='color:#10b981'>PASS</td></tr>"+lg.innerHTML;return;}
  if(saveLog)document.getElementById('oc').innerText=parseInt(document.getElementById('oc').innerText)+1;
  var c="",act="",dLabel=dt.toUpperCase();
  if(dt==='finish'){c="Worn Cutting Insert / Improper Coolant Flow (89% Confidence)";act="Replace cutting insert & verify coolant pressure at nozzle.";}
  else if(dt==='burr'){c="Dull Cutting Edge / Excessive Feed Rate (91% Confidence)";act="Index tool edge & verify automated deburring cycle.";}
  else if(dt==='thread'){c="Tap Wear / Pitch Diameter Shift (87% Confidence)";act="Replace thread tap & validate batch with Go/No-Go gauge.";}
  else if(dt==='crack'){c="Die Stress / Forging Temperature Drop (88% Confidence)";act="Perform 100% MPI crack inspection & calibrate induction heater.";}
  else if(dt==='blowhole'){c="Gas Entrapment / Low Pouring Temperature (86% Confidence)";act="Clean die air vents & verify molten metal degassing.";}
  else if(dt==='weld'){c="Low Arc Current / Shielding Gas Leak (90% Confidence)";act="Calibrate wire feed/ampere & inspect CO2/Argon gas flow.";}
  else if(dt==='hardness'){c="Quenching Oil Temp / Tempering Drift (Deviation: "+diff+" HRC)";act="Quarantine suspect lot, audit furnace cycle & re-test HRC.";}
  else if(dt==='rust'){c="Low Anti-Rust Oil Concentration / Humidity (85% Confidence)";act="Re-dip batch in rust-preventive oil & seal in VCI packaging.";}
  else if(dt==='custom'){var ct=document.getElementById('custTxt').value||"Custom Anomaly";dLabel=ct;c="5-Why Root Cause: Process Parameter Drift on "+ct+" (84% Confidence)";act="Quarantine suspect batch & conduct 4M audit.";}
  else{c=(pt==='wear')?"Progressive Cutting Tool Wear (Deviation: "+diff+" mm)":"CNC Tool Offset Entry Error (Deviation: "+diff+" mm)";act="Compensate CNC tool offset by "+(-diff)+" mm & inspect next 5 consecutive parts.";}
  var today=new Date().toLocaleDateString('en-GB');
  out.innerHTML="<div style='display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:8px'><span>Report ID: 8D-"+Math.floor(1000+Math.random()*9000)+"</span><span>Date: "+today+"</span></div><div class='fail'>🚨 REJECT — Out of Specification (Deviation: "+diff+")</div><table><tr><th>Organization</th><td>"+bName+"</td></tr><tr><th>Part & Batch ID</th><td>"+p+"</td></tr><tr><th>Defect Category</th><td>"+dLabel+"</td></tr><tr><th>D4 Root Cause</th><td>"+c+"</td></tr><tr><th>D5 CAPA Action</th><td>"+act+"</td></tr></table><br>"+imgTag+"<small style='color:var(--sub)'>"+bName+" • CO-POWERED BY VISHWASH</small><br><br><button class='run no-print' style='background:linear-gradient(135deg,#10b981,#059669)' onclick='window.print()'>🖨️ Print / Save Full 8D PDF Report</button>";
  if(saveLog)lg.innerHTML="<tr><td>"+p+"</td><td>"+dLabel+"</td><td>"+thumb+"</td><td style='color:#ef4444'>REJECT</td></tr>"+lg.innerHTML;
}
