<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QualityPilot AI — VISHWASH</title>
<style>
:root{--bg:#f4f7fb;--card:#ffffff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--inp:#f8fafc;--shadow:0 6px 20px rgba(15,23,42,0.05)}
body.dark{--bg:#090d16;--card:#111827;--text:#f1f5f9;--sub:#94a3b8;--border:#1f2937;--inp:#0f172a;--shadow:0 6px 20px rgba(0,0,0,0.35)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;transition:background .2s,color .2s,transform .2s}
body{display:flex;min-height:100vh;background:var(--bg);color:var(--text);font-weight:400;overflow-x:hidden}

#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#132238 0%,#060911 100%);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden;animation:curtainOut 0.85s cubic-bezier(0.77,0,0.175,1) 3.6s forwards}
.bp-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.07) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.laser-scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#38bdf8,#818cf8,transparent);box-shadow:0 0 18px #38bdf8;animation:scanDown 2.8s ease-in-out infinite;pointer-events:none}
.hud-corner{position:absolute;width:28px;height:28px;border:2px solid rgba(56,189,248,0.55);pointer-events:none}
.tl{top:22px;left:22px;border-right:none;border-bottom:none}
.tr{top:22px;right:22px;border-left:none;border-bottom:none}
.bl{bottom:22px;left:22px;border-right:none;border-top:none}
.br{bottom:22px;right:22px;border-left:none;border-top:none}
.hud-tag{position:absolute;font-size:10px;letter-spacing:2px;color:rgba(56,189,248,0.7);font-family:monospace}
.ht-l{top:26px;left:58px}
.ht-r{bottom:26px;right:58px}

.eng-core{position:relative;width:340px;height:235px;display:flex;align-items:center;justify-content:center;perspective:800px}
.arc-svg{position:absolute;top:-18px;left:0;width:340px;height:210px;overflow:visible;animation:arcFloat 3.4s ease-in-out infinite}
.arc-text{font-size:13.8px;font-weight:700;letter-spacing:2.4px;fill:url(#arcGrad);filter:drop-shadow(0 0 10px rgba(56,189,248,0.75))}
.orbit-ring{position:absolute;top:64px;width:158px;height:158px;border:1px dashed rgba(56,189,248,0.45);border-radius:50%;animation:spinSlow 10s linear infinite}
.orbit-ring2{position:absolute;top:76px;width:134px;height:134px;border:1.5px solid rgba(129,140,248,0.3);border-top-color:#38bdf8;border-bottom-color:#818cf8;border-radius:50%;animation:spinRev 4.5s linear infinite}
.gear-cluster{position:relative;top:24px;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;animation:tilt3D 3.5s ease-in-out infinite}
.g-main{width:76px;height:76px;fill:none;stroke:#38bdf8;stroke-width:2.1;filter:drop-shadow(0 0 14px rgba(56,189,248,0.8));animation:spinCw 3.2s linear infinite}
.g-sec{width:46px;height:46px;fill:none;stroke:#818cf8;stroke-width:2.3;margin-left:-11px;margin-top:32px;filter:drop-shadow(0 0 12px rgba(129,140,248,0.8));animation:spinRev 2s linear infinite}
.g-tri{width:34px;height:34px;fill:none;stroke:#22d3ee;stroke-width:2.4;margin-left:-84px;margin-top:-42px;filter:drop-shadow(0 0 10px rgba(34,211,238,0.8));animation:spinRev 1.6s linear infinite}

.sp-title{font-size:28px;font-weight:700;letter-spacing:1.2px;margin-top:6px;background:linear-gradient(90deg,#ffffff,#38bdf8,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:slideUp 0.7s ease 0.3s both}
.sp-sub{font-size:11.5px;letter-spacing:4px;color:#38bdf8;margin-top:6px;font-weight:600;animation:slideUp 0.7s ease 0.55s both}
.sp-loader{width:250px;height:4px;background:#1e293b;border-radius:10px;overflow:hidden;margin-top:18px;box-shadow:0 0 12px rgba(56,189,248,0.25)}
.sp-bar{height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#38bdf8,#818cf8);animation:loadBar 3.3s cubic-bezier(0.4,0,0.2,1) forwards}
.boot-log{font-family:monospace;font-size:10.5px;color:#94a3b8;letter-spacing:1.2px;margin-top:10px;height:14px}

@keyframes scanDown{0%,100%{top:8%;opacity:0.2}50%{top:92%;opacity:0.95}}
@keyframes arcFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
@keyframes tilt3D{0%,100%{transform:rotateY(16deg) rotateX(6deg)}50%{transform:rotateY(-16deg) rotateX(-6deg)}}
@keyframes spinCw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spinRev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes loadBar{to{width:100%}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes curtainOut{0%{transform:scale(1);opacity:1}100%{transform:scale(1.06);opacity:0;visibility:hidden;pointer-events:none}}
@keyframes slideShowDash{from{opacity:0;transform:translateX(35px)}to{opacity:1;transform:translateX(0)}}
.anim-in{animation:slideShowDash 0.75s cubic-bezier(0.22,1,0.36,1) 3.65s both}

.side{width:265px;background:linear-gradient(180deg,#0f172a 0%,#090d16 100%);color:#fff;padding:20px 16px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #1e293b}
.brand-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #1e293b}
.logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;overflow:hidden}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.side h2{color:#fff;font-size:17px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;margin-bottom:6px;background:transparent;color:#94a3b8;border:none;border-radius:9px;cursor:pointer;font-weight:500;font-size:13.5px}
.nav:hover{background:#1e293b;color:#fff;transform:translateX(4px)}
.nav.on{background:linear-gradient(90deg,#2563eb,#3b82f6);color:#fff;font-weight:500;box-shadow:0 4px 12px rgba(37,99,235,0.3)}
.dm-btn{width:100%;padding:9px;margin-bottom:14px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:9px;cursor:pointer;font-weight:500;font-size:12.5px}
.api-box{background:#111827;padding:12px;border-radius:10px;margin-top:14px;border:1px solid #1f2937}
.api-box small{color:#38bdf8;font-weight:500;display:block;margin-bottom:6px;font-size:11px}
.api-row{display:flex;gap:6px;align-items:center}
.api-row input,.api-row input:focus{background:#090d16!important;color:#38bdf8!important;border:1px solid #38bdf8;padding:7px 9px;font-size:12px;margin:0;border-radius:7px;flex:1;box-shadow:none}
.eye-btn{background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12px}
.vb{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #38bdf8;padding:12px;border-radius:12px;text-align:center}
.vb small{font-size:9.5px;color:#94a3b8;letter-spacing:1.8px;font-weight:500}
.vb b{display:block;font-size:15px;color:#38bdf8;letter-spacing:2px;margin-top:3px;font-weight:600}
.main{flex:1;padding:24px;max-width:1400px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card{background:var(--card);padding:16px 18px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#2563eb}
.card.c2::before{background:#10b981}.card.c3::before{background:#f59e0b}.card.c4::before{background:#8b5cf6}
.card:hover{transform:translateY(-4px)}
.card small{color:var(--sub);font-weight:500;font-size:12px}
.card h3{font-size:22px;font-weight:600;margin-top:5px}
.box{background:var(--card);padding:22px;border-radius:14px;border:1px solid var(--border);margin-bottom:18px;box-shadow:var(--shadow)}
.box h3{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{font-size:12.5px;font-weight:500;color:var(--sub);display:block;margin-bottom:5px}
input,select{width:100%;padding:10px 12px;margin-bottom:13px;border:1px solid var(--border);border-radius:9px;background:var(--inp);color:var(--text);font-size:13.5px;font-weight:400;outline:none}
input:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.12);background:var(--card)}
select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:15px;padding-right:34px;cursor:pointer}
input[type="file"]{padding:8px;border-style:dashed;cursor:pointer}
.run{width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:9px;font-weight:500;font-size:13.5px;cursor:pointer;margin-bottom:8px}
.ai-btn{width:100%;padding:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:9px;font-weight:500;font-size:13.5px;cursor:pointer;margin-bottom:8px}
.tab{display:none}.tab.on{display:block;animation:slideShowDash 0.45s ease}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:8px;font-size:13.5px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
